global:
  resolve_timeout: 5m
  smtp_smarthost: ''
  smtp_from: 'alertmanager@antriin.com'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'

receivers:
  - name: 'default'
    webhook_configs:
      - url: ${ALERTMANAGER_WEBHOOK_URL:-}
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'dev', 'instance']