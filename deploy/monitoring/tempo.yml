server:
  http_listen_port: 3200
  grpc_listen_port: 4317

ingester:
  trace_idle_period: 10s
  max_block_bytes: 1073741824
  max_traces: 10000
  lifespan: 2h

compactor:
  working_directory: /tempo/compactor
  shared_store: filesystem

storage:
  trace:
    backend: local
    local:
      path: /tempo/data
    wal:
      enabled: true
      path: /tempo/wal

limits:
  max_bytes_per_trace: 10485760
  max_total_traces_per_stream: 100000
  max_bytes_per_span: 1024