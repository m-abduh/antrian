server {
    listen 80;
    server_name tunggu.id www.tunggu.id;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name api.tunggu.id;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name admin.tunggu.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tunggu.id www.tunggu.id;

    ssl_certificate /etc/letsencrypt/live/tunggu.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunggu.id/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 443 ssl http2;
    server_name api.tunggu.id;

    ssl_certificate /etc/letsencrypt/live/tunggu.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunggu.id/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads/ {
        alias /home/mabduh/projects/antrian/server/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 443 ssl http2;
    server_name admin.tunggu.id;

    ssl_certificate /etc/letsencrypt/live/tunggu.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunggu.id/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
