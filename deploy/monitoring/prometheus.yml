global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'antriin-server'
    metrics_path: /metrics
    static_configs:
      - targets: ['server:4000']

  - job_name: 'antriin-client'
    metrics_path: /metrics
    static_configs:
      - targets: ['client:3000']

  - job_name: 'antriin-admin'
    metrics_path: /metrics
    static_configs:
      - targets: ['admin:3001']

  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongo:27017']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'nginx'
    metrics_path: /metrics
    static_configs:
      - targets: ['nginx:9113']

  - job_name: 'glitchtip'
    static_configs:
      - targets: ['glitchtip:8080']

  - job_name: 'uptime-kuma'
    static_configs:
      - targets: ['uptime-kuma:3001']